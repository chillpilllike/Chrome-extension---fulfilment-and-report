<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Secretgreen order context</title><style>body{font:15px system-ui;background:#f3f6f4;color:#203c2e;max-width:1100px;margin:32px auto;padding:0 24px}section{background:white;border:1px solid #d7e2d9;border-radius:10px;padding:20px;margin:16px 0}h1{font-size:24px}h2{font-size:18px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #dde5df}p{white-space:pre-wrap;overflow-wrap:anywhere}.safe{background:#eaf6ee}small{color:#64746b}a{color:#176147}</style></head><body><h1>Secretgreen · Order context</h1><p>Internal workspace. Only the customer reply preview is customer-facing.</p><div id="content">Loading the linked order…</div><script>const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'',location.pathname);const root=document.getElementById('content');function add(tag,text,parent=root){const e=document.createElement(tag);e.textContent=String(text??'');parent.append(e);return e}fetch('/api/public/secretgreen-support/agent-context',{headers:{'X-Support-Context':token},cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to load order');root.replaceChildren();if(!d.order){add('p',d.message);return}const o=d.order,s=add('section','');add('h2',o.name,s);add('p',(o.partner_id?.[1]||'')+' · '+o.state+' · '+o.amount_total+' '+(o.currency_id?.[1]||''),s);const a=add('a','Open order in Odoo ↗',s);if(o.odoo_url?.startsWith('https://'))a.href=o.odoo_url;a.target='_blank';a.rel='noreferrer';const safe=add('section','');safe.className='safe';add('h2','Customer reply preview',safe);add('p',d.customer_preview.reply,safe);const items=add('section','');add('h2','Original order items',items);const t=add('table','',items);for(const line of o.items||[]){const tr=add('tr','',t);add('td',line.name,tr);add('td',line.product_uom_qty,tr);add('td',line.price_total,tr)}const ops=add('section','');add('h2','Internal fulfilment',ops);for(const line of d.internal_fulfilment||[])add('p',[line.asin,line.quantity,line.state,line.ordered_at,line.amazon_order_id,line.amazon_status].filter(Boolean).join(' · '),ops);const h=add('section','');add('h2','Odoo history · internal',h);for(const e of d.history.events||[]){add('small',e.date,h);const doc=new DOMParser().parseFromString(e.body||'','text/html');add('p',doc.body.textContent,h)}}).catch(e=>{root.textContent=e.message});</script></body></html>
