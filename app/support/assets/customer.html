<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Secretgreen order help</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#193b2d;background:#fff}header{background:#176147;color:white;padding:20px}header p{margin:6px 0 0;font-size:13px}h1{font-size:20px;margin:0}main{padding:20px}label{display:block;font-size:13px;font-weight:650;margin:15px 0 6px}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #ccd9d0;border-radius:7px;font:inherit;background:white}textarea{min-height:80px}button{cursor:pointer;border:0;background:#176147;color:white;padding:11px 16px;border-radius:7px;font:600 14px system-ui;margin-top:16px}button:disabled{opacity:.5;cursor:wait}.secondary{background:#edf4ef;color:#176147}small{color:#607167;display:block;line-height:1.5;margin-top:8px}#error{color:#942f2f;background:#fff2ed;padding:12px;margin:0 20px;display:none}#card{background:#edf6f0;padding:14px;border-radius:8px;line-height:1.6;margin:15px 0}iframe{border:0;width:100%;height:480px}#chat{display:none}#chat>p{margin:12px 20px;font-size:13px}#loading{font-size:13px}nav{display:flex;gap:10px;align-items:center}a{color:#176147}</style></head><body><header><h1>Secretgreen order help</h1><p>Verify your email to choose an order securely.</p></header><p id="error" role="alert"></p><main id="entry"><form id="identify"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254"><button id="send">Send verification code</button><small>We verify your email before showing your orders.</small></form><form id="verify" hidden><p>Check your email for a six-digit code.</p><label for="code">Verification code</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button>Verify email</button><button type="button" class="secondary" id="restart">Use a different email</button></form><section id="orders" hidden><p id="loading" role="status"></p><label for="picker">Choose an order</label><select id="picker"><option value="">No order / I have a general question</option></select><nav><button id="prev" class="secondary">Previous</button><small id="page"></small><button id="next" class="secondary">Next</button></nav><div id="card">No order is linked. Our support team can help with your question.</div><form id="begin"><label for="message">Your question</label><textarea id="message" required maxlength="4000" placeholder="Tell us how we can help"></textarea><button>Start chat</button></form></section></main><section id="chat"><p id="summary"></p><iframe id="conversation" title="Secretgreen live support chat"></iframe></section><script>
const P='/api/public/secretgreen-support',L='https://libredesk.185.194.236.161.sslip.io';let token='',challenge='',page=1,rows=[],chatToken='';const $=id=>document.getElementById(id);
function error(message){$('error').textContent=message||'';$('error').style.display=message?'block':'none'}
async function api(path,data){const r=await fetch(P+path,{method:data?'POST':'GET',cache:'no-store',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(data?{body:JSON.stringify(data)}:{})});let d;try{d=await r.json()}catch{throw Error('Support is temporarily unavailable. Please try again later.')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Please check the details and try again.');return d}
async function busy(form,fn){error('');const buttons=form.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{await fn()}catch(e){error(e.message)}finally{buttons.forEach(b=>b.disabled=false)}}
$('identify').onsubmit=e=>{e.preventDefault();busy(e.target,async()=>{const d=await api('/request-code',{email:$('email').value});challenge=d.challenge;$('identify').hidden=true;$('verify').hidden=false;$('code').focus()})};
$('restart').onclick=()=>{$('identify').hidden=false;$('verify').hidden=true;challenge='';token='';error('')};
$('verify').onsubmit=e=>{e.preventDefault();busy(e.target,async()=>{const d=await api('/verify',{challenge,code:$('code').value});token=d.token;$('verify').hidden=true;$('orders').hidden=false;await load()})};
async function load(){error('');$('loading').textContent='Loading your orders…';$('picker').replaceChildren(new Option('No order / I have a general question',''));rows=[];preview();try{const d=await api('/orders?page='+page);rows=d.orders;for(const o of rows)$('picker').add(new Option(o.reference+' · '+String(o.date||'').slice(0,10)+' · '+(o.status==='not_confirmed'?'Not confirmed':o.status.replaceAll('_',' '))+' · '+(o.total||'')+' '+(o.currency||''),o.id));$('next').disabled=!d.has_more;$('prev').disabled=page===1;$('page').textContent='Page '+page;$('loading').textContent=rows.length?'Your orders on Secretgreen':'No orders were found for this email. You can still start a chat.'}catch(e){$('loading').textContent='We could not load your orders. You can still start a chat.';error(e.message)}}
function preview(){const o=rows.find(x=>String(x.id)===$('picker').value);$('card').textContent=o?o.reply:'No order is linked. Our support team can help with your question.'}
$('picker').onchange=preview;$('next').onclick=()=>{page++;load()};$('prev').onclick=()=>{page=Math.max(1,page-1);load()};
$('begin').onsubmit=e=>{e.preventDefault();busy(e.target,async()=>{const d=await api('/start',{order_id:$('picker').value?Number($('picker').value):null,message:$('message').value});chatToken=d.session_token;if(new URLSearchParams(location.search).get('embedded')==='1'&&window.parent!==window){window.parent.postMessage({type:'SECRETGREEN_CHAT_LINKED',sessionToken:chatToken},'https://secretgreen.com.au');$('entry').style.display='none';$('chat').style.display='block';$('summary').textContent='Your order is linked. Continue in the Chat tab.';return}$('entry').style.display='none';$('chat').style.display='block';$('summary').textContent=d.reply;$('conversation').src=L+'/widget?inbox_id='+encodeURIComponent(d.inbox_uuid)})};
window.addEventListener('message',e=>{const frame=$('conversation');if(e.origin!==L||e.source!==frame.contentWindow||!chatToken)return;if(e.data?.type==='VUE_APP_READY'){frame.contentWindow.postMessage({type:'SESSION_DATA',sessionToken:chatToken},L);frame.contentWindow.postMessage({type:'SET_MOBILE_STATE',isMobile:true},L);frame.contentWindow.postMessage({type:'WIDGET_OPENED'},L)}});
</script></body></html>
