<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Nutricity Tracking</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Nutricity Tracking</h1>
      <label>
        App URL
        <input id="apiBase" spellcheck="false">
      </label>
      <label>
        Admin token
        <input id="adminToken" type="password" spellcheck="false" autocomplete="off">
      </label>
      <label class="checkbox-row">
        <input id="headlessTrackingMode" type="checkbox">
        <span>Run tracking in background/headless Chrome</span>
      </label>
      <label class="checkbox-row">
        <input id="autoTrackingEnabled" type="checkbox">
        <span>Auto check Amazon tracking</span>
      </label>
      <label>
        Auto check every hours
        <input id="autoTrackingHours" type="number" min="1" max="168" step="1">
      </label>
      <section class="single-order-panel">
        <h2>Track Amazon order(s)</h2>
        <label>
          Amazon order number
          <input id="singleAmazonOrderId" placeholder="113-0000000-0000000" spellcheck="false">
        </label>
        <label>
          Queue several Amazon orders
          <textarea id="amazonOrderBatch" placeholder="Paste one or many order numbers, separated by line, comma, or space." spellcheck="false"></textarea>
        </label>
        <div class="actions">
          <button id="trackSingleOrder">Track order</button>
          <button id="trackQueuedOrders" class="secondary">Track queued orders</button>
        </div>
      </section>
      <section class="track-all-panel">
        <h2>Track all from Amazon order history</h2>
        <div class="track-all-grid">
          <label>
            Start from page
            <input id="trackAllStartPage" type="number" min="1" max="999" step="1">
          </label>
          <label>
            Pages to scan
            <input id="trackAllMaxPages" type="number" min="1" max="999" step="1">
          </label>
        </div>
        <div class="actions">
          <button id="trackAll" class="warning">Track all</button>
          <button id="resumeTrackAll" class="secondary">Resume Track all</button>
          <button id="stopTrackAll" class="danger">Stop Track all</button>
        </div>
      </section>
      <section id="modeNotice" class="mode-notice"></section>
      <div class="actions">
        <button id="save">Save</button>
        <button id="testConnection" class="secondary">Check connection</button>
        <button id="openHeadlessSignin" class="secondary">Open headless sign-in</button>
        <button id="checkHeadlessSignin" class="secondary">Check headless sign-in</button>
        <button id="start">Start tracking</button>
        <button id="stop" class="secondary">Stop</button>
      </div>
      <section id="status"></section>
      <ol id="logs"></ol>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
