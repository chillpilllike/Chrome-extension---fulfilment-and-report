<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Nutricity ePost Tracking</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Nutricity ePost Tracking</h1>
      <label>
        App URL
        <input id="apiBase" spellcheck="false">
      </label>
      <label>
        Admin token
        <input id="adminToken" type="password" spellcheck="false" autocomplete="off">
      </label>
      <label>
        Auto check every hours
        <input id="intervalHours" type="number" min="1" max="720" step="1">
      </label>
      <label class="checkbox-row">
        <input id="autoEpostEnabled" type="checkbox">
        <span>Auto check ePost tracking</span>
      </label>
      <label class="checkbox-row">
        <input id="headlessEpostMode" type="checkbox">
        <span>Run ePost in background/headless Chrome</span>
      </label>
      <section id="modeNotice" class="mode-notice"></section>
      <div class="actions">
        <button id="save">Save</button>
        <button id="testConnection" class="secondary">Check connection</button>
        <button id="openHeadlessSession" class="secondary">Open headless session</button>
        <button id="start">Track due codes</button>
        <button id="stop" class="secondary">Stop</button>
      </div>
      <section id="status"></section>
      <ol id="logs"></ol>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
