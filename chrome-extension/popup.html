<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Nutricity Fulfilment</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Nutricity Fulfilment</h1>
      <label>
        App URL
        <input id="apiBase" spellcheck="false">
      </label>
      <label>
        Admin token
        <input id="adminToken" type="password" spellcheck="false" autocomplete="off">
      </label>
      <label>
        Card last 4 preference
        <input id="cardLast4Preference" spellcheck="false" placeholder="4421, 3454">
      </label>
      <label class="checkbox-row">
        <input id="editExistingAddress" type="checkbox">
        <span>Edit existing address</span>
      </label>
      <label class="checkbox-row">
        <input id="fulfilAvailableMixedAsin" type="checkbox">
        <span>Process available items in mixed-ASIN orders</span>
      </label>
      <label class="checkbox-row">
        <input id="splitMixedAsinOrders" type="checkbox">
        <span>Process multi-ASIN orders as separate Part orders</span>
      </label>
      <label class="checkbox-row">
        <input id="browserlessOrderMode" type="checkbox">
        <span>Place queued orders in background</span>
      </label>
      <div class="actions">
        <button id="save">Save</button>
        <button id="testConnection" class="secondary">Check connection</button>
        <button id="start">Start next queued order</button>
        <button id="pauseResume" class="secondary">Pause</button>
        <button id="skipJob" class="secondary">Skip</button>
        <button id="markMissing" class="warning">Missing</button>
        <button id="stop" class="secondary">Stop</button>
        <button id="clearFailed" class="danger">Clear stale queue</button>
      </div>
      <section id="connectionNotice" class="connection-notice" hidden></section>
      <section id="duplicateOrderAlert" class="duplicate-order-alert" hidden>
        <strong>Amazon order already exists</strong>
        <div id="duplicateOrderRows"></div>
        <button id="resetDuplicateFulfilment" class="danger">Clear app order and continue</button>
      </section>
      <section id="status"></section>
      <section class="queue">
        <div class="section-title">
          <h2>Queued orders</h2>
          <span id="queueCount">0 waiting</span>
        </div>
        <div id="queuedJobs" class="queued-jobs"></div>
      </section>
      <section class="pricing">
        <h2>Profit check</h2>
        <table>
          <thead>
            <tr>
              <th>ASIN</th>
              <th>Qty</th>
              <th>Store</th>
              <th>Amazon</th>
              <th>P/L</th>
            </tr>
          </thead>
          <tbody id="pricingRows"></tbody>
          <tfoot>
            <tr>
              <td colspan="4">Total</td>
              <td id="pricingTotal">$0.00</td>
            </tr>
          </tfoot>
        </table>
      </section>
      <ol id="logs"></ol>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
